name: AI Regression Starter Kit CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  regression-starter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Run starter regression checks
        run: |
          pytest python/tests -v --html=reports/test_report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-regression-test-report
          path: reports/test_report.html
